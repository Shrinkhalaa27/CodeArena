# CodeArena local stack.
#   docker compose up -d --build                      # web + api + worker + postgres + redis
#   docker compose --profile judge up -d --build      # ...plus self-hosted Judge0 CE (real sandbox)
# Judge0 is never published to the host; only the API/worker reach it on the internal network.
name: codearena

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://codearena:codearena@postgres:5432/codearena
  REDIS_URL: redis://redis:6379/0
  QUEUE_BACKEND: redis
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  JUDGE_BACKEND: ${JUDGE_BACKEND:-judge0}
  JUDGE0_BASE_URL: http://judge0-server:2358
  JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_MODEL: ${LLM_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_DAILY_QUOTA: ${AI_DAILY_QUOTA:-20}
  SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: codearena
      POSTGRES_DB: codearena
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codearena -d codearena"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
      RUN_SEED: ${RUN_SEED:-true}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "app.workers.judge_worker"]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  # ---------------- Judge0 CE (profile: judge) ----------------
  # Needs infra/judge0/judge0.conf (copy from judge0.conf.example). Judge0 1.13.x uses isolate and
  # needs privileged workers and cgroup v1 on the host - see docs/DEVELOPMENT.md "Judge0 notes".
  judge0-server:
    profiles: [judge]
    image: judge0/judge0:1.13.1
    volumes: ["./infra/judge0/judge0.conf:/judge0.conf:ro"]
    privileged: true
    restart: unless-stopped
    depends_on: [judge0-db, judge0-redis]

  judge0-worker:
    profiles: [judge]
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes: ["./infra/judge0/judge0.conf:/judge0.conf:ro"]
    privileged: true
    restart: unless-stopped
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    profiles: [judge]
    image: postgres:16-alpine
    env_file: infra/judge0/judge0.conf
    volumes: [judge0-pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  judge0-redis:
    profiles: [judge]
    image: redis:7-alpine
    command: ["sh", "-c", 'redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: infra/judge0/judge0.conf
    restart: unless-stopped

volumes:
  pgdata:
  judge0-pgdata:
